app-id: io.github.yotserlab.vytermweb
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.golang
command: vy-termweb
build-options:
  # pnpm install + go mod download need network during the build — build-args
  # are forwarded to the `flatpak build` calls flatpak-builder runs internally.
  build-args:
    - --share=network
finish-args:
  # The server binds localhost and does real SSH/SFTP/ping/traceroute/SOCKS.
  - --share=network
  # The file manager, text editor and session logs work on the real
  # filesystem; this is a sysadmin tool, host access is the point.
  - --filesystem=host
  # Lets the app use flatpak-spawn --host so "Local Shell" is a real host
  # shell and tools like ip/ffmpeg/lscpu act on the host, not the runtime.
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: vy-termweb
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: "0"
        GOPATH: /run/build/vy-termweb/go
    sources:
      # Selective sources only — copying the whole repo would drag in
      # node_modules, dist-go, build dirs and .flatpak-builder itself.
      - type: dir
        path: ../../frontend/src
        dest: frontend/src
      - type: file
        path: ../../frontend/index.html
        dest: frontend
      - type: file
        path: ../../frontend/package.json
        dest: frontend
      - type: file
        path: ../../frontend/tsconfig.json
        dest: frontend
      - type: file
        path: ../../frontend/vite.config.ts
        dest: frontend
      - type: dir
        path: ../../backend
        dest: backend
      - type: dir
        path: ../../packaging
        dest: packaging
      - type: file
        path: ../../package.json
      - type: file
        path: ../../pnpm-workspace.yaml
      - type: file
        path: ../../pnpm-lock.yaml
    build-commands:
      - rm -rf backend/dist backend/vy-termweb backend/termweb packaging/flatpak/repack
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm -C frontend build
      - rm -rf backend/dist && cp -a frontend/dist backend/dist
      - go -C backend build -trimpath -ldflags "-s -w" -o vy-termweb .
      - install -Dm755 backend/vy-termweb /app/bin/vy-termweb
      - install -Dm644 packaging/flatpak/io.github.yotserlab.vytermweb.desktop /app/share/applications/io.github.yotserlab.vytermweb.desktop
      - install -Dm644 packaging/flatpak/io.github.yotserlab.vytermweb.metainfo.xml /app/share/metainfo/io.github.yotserlab.vytermweb.metainfo.xml
      - install -Dm644 packaging/flatpak/io.github.yotserlab.vytermweb.svg /app/share/icons/hicolor/scalable/apps/io.github.yotserlab.vytermweb.svg
