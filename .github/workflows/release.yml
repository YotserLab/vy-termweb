name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-go.sh
      - run: SKIP_BUILD=1 SKIP_FRONTEND=1 ./scripts/build-deb.sh amd64
      - run: SKIP_BUILD=1 SKIP_FRONTEND=1 ./scripts/build-deb.sh arm64
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-go/vy-termweb-*
            dist-go/SHA256SUMS
            dist-deb/*.deb

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.yotserlab.vytermweb.yml
          bundle: io.github.yotserlab.vytermweb.flatpak
          runtime-repo: https://flathub.org/repo/flathub.flatpakrepo
          upload-artifact: false
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
